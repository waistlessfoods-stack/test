<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" role="img" aria-labelledby="title desc">
  <title id="title">Proposed WaistLess Foods member and newsletter workflow</title>
  <desc id="desc">A discussion flowchart separating website account access, newsletter archive entitlement, marketing consent, publishing, archiving, and broadcast delivery.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#173F41" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#397174"/>
    </marker>
    <style>
      .title { font: 700 36px Inter, Arial, sans-serif; fill: #123F41; }
      .subtitle { font: 400 18px Inter, Arial, sans-serif; fill: #526B6C; }
      .lane-title { font: 700 21px Inter, Arial, sans-serif; fill: #0A6266; letter-spacing: 0.4px; }
      .box-title { font: 700 17px Inter, Arial, sans-serif; fill: #123F41; text-anchor: middle; }
      .box-copy { font: 400 14px Inter, Arial, sans-serif; fill: #405E60; text-anchor: middle; }
      .decision { font: 700 16px Inter, Arial, sans-serif; fill: #5E430E; text-anchor: middle; }
      .label { font: 700 13px Inter, Arial, sans-serif; fill: #0A6266; }
      .note { font: 400 14px Inter, Arial, sans-serif; fill: #53696A; }
      .footer-title { font: 700 15px Inter, Arial, sans-serif; fill: #7B521D; }
      .footer-copy { font: 400 14px Inter, Arial, sans-serif; fill: #604C34; }
      .flow { fill: none; stroke: #397174; stroke-width: 3; marker-end: url(#arrow); }
      .flow-dashed { fill: none; stroke: #6E9698; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="1060" fill="#FCFBF7"/>
  <rect x="0" y="0" width="1600" height="12" fill="#16B0B9"/>

  <text id="workflow-title" x="64" y="68" class="title">Proposed Member &amp; Newsletter Workflow</text>
  <text x="64" y="102" class="subtitle">Discussion draft for Amber and John — decisions made in the meeting will determine the final implementation.</text>

  <g aria-label="Member access and consent lane">
    <rect x="40" y="138" width="1520" height="346" rx="24" fill="#F1FAF9" stroke="#C5E8E5" stroke-width="2"/>
    <text x="72" y="179" class="lane-title">1  MEMBER ACCESS &amp; EMAIL CONSENT</text>

    <rect x="74" y="224" width="190" height="92" rx="16" fill="#FFFFFF" stroke="#159DA2" stroke-width="2" filter="url(#shadow)"/>
    <text x="169" y="260" class="box-title">Create account</text>
    <text x="169" y="285" class="box-copy">Website sign-up</text>

    <path d="M264 270 H314" class="flow"/>

    <rect x="318" y="224" width="204" height="92" rx="16" fill="#FFFFFF" stroke="#159DA2" stroke-width="2" filter="url(#shadow)"/>
    <text x="420" y="260" class="box-title">Verify email</text>
    <text x="420" y="285" class="box-copy">Confirm account ownership</text>

    <path d="M522 270 H566" class="flow"/>

    <polygon points="694,207 818,270 694,333 570,270" fill="#FFF4D6" stroke="#C38A18" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="694" y="263" class="decision">Qualifies as</text>
    <text x="694" y="285" class="decision">a member?</text>

    <path d="M818 270 H858" class="flow"/>
    <text x="827" y="254" class="label">YES</text>

    <rect x="862" y="224" width="224" height="92" rx="16" fill="#DDF5F3" stroke="#0F8D8F" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="974" y="254" class="box-title">Archive access</text>
    <text x="974" y="278" class="box-copy">Protected member page</text>
    <text x="974" y="297" class="box-copy">Current + past issues</text>

    <path d="M1086 270 H1119" class="flow"/>

    <polygon points="1243,207 1367,270 1243,333 1119,270" fill="#FFF4D6" stroke="#C38A18" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="1243" y="263" class="decision">Active email</text>
    <text x="1243" y="285" class="decision">consent?</text>

    <path d="M1367 270 H1398" class="flow"/>
    <text x="1375" y="254" class="label">YES</text>

    <rect x="1402" y="224" width="126" height="92" rx="16" fill="#DDF5F3" stroke="#0F8D8F" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="1465" y="254" class="box-title">Active</text>
    <text x="1465" y="276" class="box-title">recipient</text>
    <text x="1465" y="298" class="box-copy">Current issue</text>

    <path d="M694 333 V366" class="flow"/>
    <text x="710" y="354" class="label">NO</text>
    <rect x="582" y="370" width="224" height="76" rx="15" fill="#F7EFE5" stroke="#A77A45" stroke-width="2"/>
    <text x="694" y="400" class="box-title">Standard account</text>
    <text x="694" y="424" class="box-copy">No archive access</text>

    <path d="M1243 333 V366" class="flow"/>
    <text x="1259" y="354" class="label">NO / UNSUBSCRIBED</text>
    <rect x="1108" y="370" width="270" height="76" rx="15" fill="#F7EFE5" stroke="#A77A45" stroke-width="2"/>
    <text x="1243" y="400" class="box-title">No campaign email</text>
    <text x="1243" y="424" class="box-copy">Archive access retained if approved</text>
  </g>

  <g aria-label="Publishing and delivery lane">
    <rect x="40" y="514" width="1520" height="406" rx="24" fill="#FFFFFF" stroke="#DCE8E6" stroke-width="2"/>
    <text x="72" y="555" class="lane-title">2  PUBLISH ONCE, THEN ARCHIVE + SEND</text>

    <rect x="74" y="674" width="196" height="94" rx="16" fill="#FFFFFF" stroke="#159DA2" stroke-width="2" filter="url(#shadow)"/>
    <text x="172" y="710" class="box-title">Prepare one issue</text>
    <text x="172" y="735" class="box-copy">Amber creates content</text>

    <path d="M270 721 H318" class="flow"/>

    <rect x="322" y="674" width="196" height="94" rx="16" fill="#FFFFFF" stroke="#159DA2" stroke-width="2" filter="url(#shadow)"/>
    <text x="420" y="710" class="box-title">Test &amp; review</text>
    <text x="420" y="735" class="box-copy">Check copy and links</text>

    <path d="M518 721 H566" class="flow"/>

    <rect x="570" y="674" width="196" height="94" rx="16" fill="#DDF5F3" stroke="#0F8D8F" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="668" y="710" class="box-title">Approve &amp; publish</text>
    <text x="668" y="735" class="box-copy">One approved current issue</text>

    <path d="M766 721 H828" class="flow"/>
    <circle cx="844" cy="721" r="8" fill="#397174"/>

    <path d="M844 721 V625 H914" class="flow"/>
    <rect x="918" y="580" width="244" height="90" rx="16" fill="#E8F7F6" stroke="#0F8D8F" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="1040" y="615" class="box-title">Add to archive</text>
    <text x="1040" y="640" class="box-copy">PDF, protected page, or both</text>

    <path d="M1162 625 H1234" class="flow"/>
    <rect x="1238" y="580" width="286" height="90" rx="16" fill="#DDF5F3" stroke="#0F8D8F" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="1381" y="615" class="box-title">Members use the archive</text>
    <text x="1381" y="640" class="box-copy">Late joiners can access older issues</text>

    <path d="M844 721 V817 H914" class="flow"/>
    <rect x="918" y="772" width="244" height="90" rx="16" fill="#E8F7F6" stroke="#0F8D8F" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="1040" y="807" class="box-title">Send current issue</text>
    <text x="1040" y="832" class="box-copy">One broadcast to the active list</text>

    <path d="M1162 817 H1234" class="flow"/>
    <rect x="1238" y="772" width="286" height="90" rx="16" fill="#DDF5F3" stroke="#0F8D8F" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="1381" y="807" class="box-title">Eligible recipients receive it</text>
    <text x="1381" y="832" class="box-copy">No automatic resend of older issues</text>

    <path d="M974 316 V526 H1381 V576" class="flow-dashed"/>
    <text x="1010" y="510" class="label">ARCHIVE ENTITLEMENT</text>

    <path d="M1465 316 V500 H1540 V817 H1528" class="flow-dashed"/>
    <text x="1320" y="492" class="label">ACTIVE RECIPIENT LIST</text>
  </g>

  <g aria-label="Decisions needed">
    <rect x="40" y="948" width="1520" height="82" rx="18" fill="#FFF4D6" stroke="#D6A64B" stroke-width="2"/>
    <text x="68" y="979" class="footer-title">DECISIONS NEEDED IN THE MEETING</text>
    <text x="68" y="1007" class="footer-copy">Who is a member?  •  Does account creation include marketing consent?  •  What happens after unsubscribe?  •  PDF, web archive, or both?  •  Who prepares and publishes each issue?</text>
  </g>
</svg>
